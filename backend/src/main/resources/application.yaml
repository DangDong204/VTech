spring:
  application:
    name: vtech

  datasource:
    url: jdbc:mysql://localhost:3306/vtech_db
    username: root
    password: mysqlDangDong2004@
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
#    drop-first: true

jwt:
  expiration: 86400000  # 24 giờ
  secretKey: ${JWT_SIGNER_KEY} # tối thiểu 256-bit / 32 ký tự

aws:
  s3:
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:5173/payment/vnpay-return
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

cleanup-data:
#  expire-minutes: 1
#  cleanup-rate-ms: 5000
  expire-minutes: 43200
  cleanup-rate-ms: 3600000

